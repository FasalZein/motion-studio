<!doctype html><html lang="en"><head><meta charset="UTF-8"/><style>
@font-face { font-family: StudioFont; src: url('IBMPlexSans.ttf'); }
body {margin:0;} #root {position:relative;width:100%;height:100%;overflow:hidden;} .patch {position:absolute;left:8px;top:8px;width:24px;height:24px;background:#e05b45;}
.mover {position:absolute;top:calc(50% - 12px);height:24px;display:flex;align-items:center;gap:4px;color:#f2d064;font:24px/24px StudioFont;} .block {width:24px;height:24px;background:#f2d064;}
</style></head><body><div id="root" data-composition-id="shot" data-width="320" data-height="180" data-duration="0.2"><div style="position:absolute;inset:0;background:#172b46"></div><div class="patch"></div><div id="mover" class="mover"><div class="block"></div>GO</div></div><script>
// The mover travels right at a constant SPEED px per film frame: left = 12 + SPEED * (START + local frame).
// The timeline seeks by shot-local time, so the frame one past the end is the next shot's first pose.
const START = 6, SPEED = 5, FPS = 30;
const mover = document.getElementById('mover');
const at = t => {mover.style.left = `${12 + SPEED * (START + Math.round(t * FPS))}px`;};
at(0);
document.fonts.ready.then(() => { window.__timelines['shot'] = { duration: () => 0.2, pause: () => {}, seek: t => at(t) }; });
</script></body></html>
